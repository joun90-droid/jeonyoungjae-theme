<!DOCTYPE html>
<html lang="ko">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3079797618341925" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>종목 상세 | 영재 테마주분석</title>
  <meta name="description" content="실시간 시세, 섹터전망, 재료분석, 분석 차트">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#07131a">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">T</div>
        <div>
          <h1>영재 테마주분석</h1>
          <p>상세 · 실시간가 · 차트</p>
        </div>
      </div>
      <a class="btn btn-ghost" href="/">← 목록</a>
    </header>

    <section class="detail-hero panel" id="hero">
      <div class="hero-kicker" id="themeLabel">THEME</div>
      <h2 id="name">불러오는 중…</h2>
      <div class="price-row">
        <div>
          <div class="price-label">실시간 현재가</div>
          <div class="price-value" id="livePrice">—</div>
        </div>
        <div>
          <div class="price-label">등락률</div>
          <div class="price-chg" id="liveChg">—</div>
        </div>
        <div>
          <div class="price-label">시세 시각</div>
          <div class="price-time" id="liveTime">—</div>
        </div>
      </div>
      <p class="sub" id="thesis"></p>
      <div class="tags" id="tags"></div>
    </section>

    <div class="ad-slot">
      <span class="ad-label">Advertisement</span>
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-3079797618341925" data-ad-slot="0000000000" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>

    <section class="kv" id="kv"></section>

    <section class="detail-grid" style="margin-top:12px">
      <div class="panel">
        <h3>분석 레이더 차트</h3>
        <canvas id="radarChart" height="260"></canvas>
      </div>
      <div class="panel">
        <h3>점수 비교</h3>
        <canvas id="scoreChart" height="260"></canvas>
      </div>
    </section>

    <section class="panel">
      <h3>섹터 전망 · 어떤 섹터가 될 것인가</h3>
      <p class="analysis-text" id="sectorView"></p>
    </section>

    <section class="panel">
      <h3>투자 논리 (설득 포인트)</h3>
      <p class="analysis-text" id="logic"></p>
    </section>

    <section class="detail-grid">
      <div class="panel">
        <h3>재료분석</h3>
        <div class="mat-list" id="materials"></div>
      </div>
      <div>
        <div class="panel">
          <h3>성장 포인트</h3>
          <ul class="checklist" id="pros"></ul>
        </div>
        <div class="panel">
          <h3>위험 포인트</h3>
          <ul class="checklist" id="cons"></ul>
        </div>
      </div>
    </section>

    <section class="panel">
      <h3>같은 테마 추천</h3>
      <div class="list" id="related"></div>
    </section>

    <footer class="footer">
      <p>참고용 분석이며 투자 권유가 아닙니다.</p>
      <p><a href="privacy.html">개인정보처리방침</a> · <a href="/">홈으로</a></p>
    </footer>
  </div>
  <script src="data.js"></script>
  <script src="detail.js" defer></script>
  <script>try{document.querySelectorAll('.adsbygoogle').forEach(function(){(adsbygoogle=window.adsbygoogle||[]).push({})})}catch(e){}</script>
</body>
</html>
